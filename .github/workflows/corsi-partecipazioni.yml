name: corsi-partecipazioni
# Andrea 14/10/2026: i corsi frequentati si scrivono sulla scheda contatto (corsi_frequentati, numero, ultimo corso).
# Due giri al giorno: 05:45 UTC (presenze del giorno prima, assenze dopo 18 ore) e 19:30 UTC (dopo le dirette del giorno).
# Scrive anche le iscrizioni ai prossimi corsi e chi era iscritto e non ha partecipato.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
    - cron: '30 19 * * *'
jobs:
  partecipazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corsi frequentati sulla scheda contatto
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python corsi_partecipazioni.py
