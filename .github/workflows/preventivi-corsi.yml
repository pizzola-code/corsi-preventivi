name: preventivi-corsi

# Il catalogo corsi promette alla scuola il preventivo a stretto giro: questo
# lavoro e' cio' che mantiene la promessa. Il ritmo lo da' cron-job.org, che
# chiama workflow_dispatch ogni minuto; il cron interno resta come rete di
# sicurezza, perche' lo scheduler di GitHub consegna i giri con molto ritardo
# (misurati 18 minuti di media, punte di 41).
on:
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova: elenca le richieste senza creare nulla"
        type: boolean
        default: false
  schedule:
    - cron: '*/10 * * * *'

# il motore scrive il registro degli invii nel repository
permissions:
  contents: write

concurrency:
  group: preventivi-corsi
  cancel-in-progress: false

jobs:
  preventivi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Richieste nuove -> preventivo e email
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          # il preventivo parte da no_reply@, non dalla casella di chi ha autenticato
          SMTP_CORSI_USER: ${{ secrets.SMTP_CORSI_USER }}
          SMTP_CORSI_PASS: ${{ secrets.SMTP_CORSI_PASS }}
          # SMS di avviso sul cellulare del modulo (Mitto, mittente "Spaggiari")
          MITTO_API_KEY: ${{ secrets.MITTO_API_KEY }}
          MITTO_CHAT_KEY: ${{ secrets.MITTO_CHAT_KEY }}
          MITTO_TRAFFIC_WA: ${{ secrets.MITTO_TRAFFIC_WA }}
        run: |
          python preventivi_corsi.py ${{ (github.event_name == 'workflow_dispatch' && inputs.prova) && '--prova' || '' }}

      # Comfort scolastico (1/10/2026): stesso giro, motore a parte. Il preventivo va all'agente e
      # all'Ufficio Preventivi, non alla scuola. Gira anche se il passo dei corsi e' andato storto.
      - name: Comfort scolastico -> preventivo all'agente
        if: always()
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SMTP_CORSI_USER: ${{ secrets.SMTP_CORSI_USER }}
          SMTP_CORSI_PASS: ${{ secrets.SMTP_CORSI_PASS }}
        run: |
          python preventivi_comfort.py ${{ (github.event_name == 'workflow_dispatch' && inputs.prova) && '--prova' || '' }}

      # Corsi in diretta: rimette la data sulle iscrizioni (hapily la svuota) prima che parta la conferma
      - name: Corsi -> data sulle iscrizioni
        if: always()
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python iscrizioni_corsi.py

      # Avviso interno su ogni evento nuovo (Andrea, 1/10/2026): Pari, Bertozzi e Dalla Rizza.
      - name: Eventi nuovi -> avviso interno
        if: always()
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SMTP_CORSI_USER: ${{ secrets.SMTP_CORSI_USER }}
          SMTP_CORSI_PASS: ${{ secrets.SMTP_CORSI_PASS }}
        run: python avvisa_eventi.py

      # Ordini dei corsi in diretta -> evento, link di nomina, e-mail alla scuola dal portale HubSpot.
      # L'invio e' acceso dalla variabile CORSI_INVIO_AUTOMATICO (repository -> Variables): 1 = acceso.
      - name: Ordini corsi -> evento e link di nomina
        if: always()
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SMTP_CORSI_USER: ${{ secrets.SMTP_CORSI_USER }}
          SMTP_CORSI_PASS: ${{ secrets.SMTP_CORSI_PASS }}
          CHIAVE_NOMINE_CORSI: ${{ secrets.CHIAVE_NOMINE_CORSI }}
          CORSI_INVIO_AUTOMATICO: ${{ vars.CORSI_INVIO_AUTOMATICO }}
        run: python corsi_ordini.py

      # Il registro degli invii va salvato subito: e' cio' che impedisce di
      # rimandare un preventivo se la trattativa viene cancellata. I giri sono
      # in fila (concurrency), quindi non si pestano.
      - name: Salva il registro degli invii
        # anche se il passo prima e' andato storto: un invio riuscito va
        # registrato comunque, o il giro dopo potrebbe rifarlo
        if: always()
        run: |
          if [ -n "$(git status --porcelain inviati.txt inviati_comfort.txt avvisati_eventi.txt ordini_corsi_gestiti.txt)" ]; then
            git config user.name "motore-preventivi"
            git config user.email "no_reply@spaggiari.eu"
            git add inviati.txt inviati_comfort.txt avvisati_eventi.txt ordini_corsi_gestiti.txt 2>/dev/null || git add inviati.txt
            git commit -m "registro: nuovi preventivi inviati"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
          fi
