name: audit-corsi
# Andrea 15/10/2026: audit mattutino dei corsi di formazione alle 5 (ora di Roma): cosa funziona, cosa no, e sistema da solo
# quello che si puo' sistemare in sicurezza. Ritmo: cron-job.org (workflow_dispatch alle 05:00 Europe/Rome);
# i due cron interni (03:00 e 04:00 UTC = 05:00 con ora legale e con ora solare) sono la rete di sicurezza: lo script gira solo
# alle 5 di Roma e una volta al giorno (marcatore audit_corsi_ultimo.txt).
on:
  workflow_dispatch:
    inputs:
      forza:
        description: "Gira e manda la mail a qualunque ora"
        type: boolean
        default: false
      prova:
        description: "Solo prova: non sistema niente e non manda la mail"
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: audit-corsi
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ultimo commit (registro e marcatore aggiornati)
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit corsi
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          SMTP_CORSI_USER: ${{ secrets.SMTP_CORSI_USER }}
          SMTP_CORSI_PASS: ${{ secrets.SMTP_CORSI_PASS }}
          CHIAVE_NOMINE_CORSI: ${{ secrets.CHIAVE_NOMINE_CORSI }}
          ZOOM_S2S_JSON: ${{ secrets.ZOOM_S2S_JSON }}
          CORSI_AUDIT_A: ${{ vars.CORSI_AUDIT_A }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python audit_corsi_mattina.py ${{ (github.event_name == 'workflow_dispatch' && inputs.forza) && '--forza' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.prova) && '--prova' || '' }}
      - name: Salva il marcatore
        if: always()
        run: |
          if [ -n "$(git status --porcelain audit_corsi_ultimo.txt)" ]; then
            git config user.name "motore-preventivi"
            git config user.email "no_reply@spaggiari.eu"
            git add audit_corsi_ultimo.txt
            git commit -m "audit corsi: fatto"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
          fi
